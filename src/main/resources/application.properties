spring.application.name=proyecto-uni


# configuración de la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyectounidb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# OpenAI configuration
openai.api.key=${OPENAI_API_KEY}


# PASO 2 PARA TWILIO
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# WhatsApp Sandbox (diferente al SMS)
twilio.whatsapp.number=${TWILIO_WHATSAPP_NUMBER:}


# Twilio SMS/WhatsApp (false = modo desarrollo, imprime en consola; true = envía con Twilio)
app.sms.enabled=${APP_SMS_ENABLED:false}

# Telegram 2FA (true = envía código al bot de Telegram; false = desactivado)
app.telegram.2fa.enabled=${APP_TELEGRAM_2FA_ENABLED:true}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}
telegram.notifications.enabled=true

# ApiPeru.dev (RENIEC / SUNAT) - Token protegido en Backend
apiperu.token=${APIPERU_TOKEN:f96e3e14b625cbc809ce0cb29060583a4b5802d36ceac65452c0b3474bee41cd}
apiperu.url.dni=${APIPERU_URL_DNI:https://api.apiperu.dev/dni}
apiperu.url.ruc=${APIPERU_URL_RUC:https://api.apiperu.dev/ruc}

# Microservicio Machine Learning Credit Scoring
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}



